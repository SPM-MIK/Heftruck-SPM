<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supermaritime onderhoud</title>
<meta name="theme-color" content="#0C2579">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Onderhoud">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --ink:#1D2328; --muted:#5E6A73; --line:#D3D8DD; --head:#1D2328; --headink:#EEF0F2;
  --signal:#F5C400; --signal-ink:#1D2328; --ok:#1E7A4C; --ok-bg:#E2F2E9;
  --warn:#B3261E; --warn-bg:#FBE4E2; --care:#8A5A00; --care-bg:#FFF1CC; --off:#8B949B; --info:#1F5F99; --info-bg:#E1ECF7;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16191C; --surface:#20252A; --ink:#E9ECEE; --muted:#9AA5AD; --line:#343B42; --head:#0E1012; --headink:#E9ECEE;
  --ok:#5CC98E; --ok-bg:#183326; --warn:#FF8A80; --warn-bg:#3A1D1B; --care:#FFD166; --care-bg:#3A3015; --off:#6F7980;
  --info:#8EC1F2; --info-bg:#1A2B3C; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#16191C; --surface:#20252A; --ink:#E9ECEE; --muted:#9AA5AD; --line:#343B42; --head:#0E1012; --headink:#E9ECEE;
  --ok:#5CC98E; --ok-bg:#183326; --warn:#FF8A80; --warn-bg:#3A1D1B; --care:#FFD166; --care-bg:#3A3015; --off:#6F7980;
  --info:#8EC1F2; --info-bg:#1A2B3C; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.4 Barlow,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;margin:0}
.muted{color:var(--muted)}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:8px;padding:11px 16px;font:600 15px Barlow,sans-serif;background:var(--ink);color:var(--bg)}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sig{background:var(--signal);color:var(--signal-ink)}
.btn.danger{background:var(--warn-bg);color:var(--warn)}
.link{border:0;background:none;color:inherit;text-decoration:underline;text-underline-offset:3px;padding:4px 0;font-size:14px}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--head)}
.login .card{background:var(--surface);border-radius:14px;padding:24px;width:100%;max-width:380px;border-top:8px solid var(--signal)}
.login h1{font-size:30px}
.login form{display:grid;gap:12px;margin-top:14px}


.who{display:flex;gap:14px;align-items:center;font-size:14px;opacity:.8}

.pill{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--signal);color:var(--signal-ink);font-size:12px;text-align:center}
.pill:empty{display:none}

main{max-width:1180px;padding:16px 18px 60px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
input,select,textarea{font:500 16px Barlow,sans-serif;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);color:var(--ink);width:100%}
.toolbar select{width:auto;flex:0 1 auto}
textarea{min-height:80px;resize:vertical}
label{display:flex;flex-direction:column;gap:4px;font:500 14px Barlow,sans-serif;color:var(--muted)}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:15px}
label.chk input{width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:500 14px Barlow,sans-serif}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.summary{color:var(--muted);font-size:14px;margin:0 2px 8px}

.list{display:grid;gap:8px}
.item{background:var(--surface);border-radius:10px;padding:12px 14px;border-left:6px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;border-top:0;border-right:0;border-bottom:0;color:inherit;width:100%}
.item:hover{box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.item .t{font:700 20px/1.15 "Barlow Condensed","Arial Narrow",sans-serif}
.item .s{color:var(--muted);font-size:14px}
.item .r{grid-row:1 / span 2;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.item.st-Open{border-left-color:var(--warn)} .item.st-In.behandeling{border-left-color:var(--info)}
.badge{display:inline-block;font:600 12px Barlow,sans-serif;border-radius:4px;padding:2px 7px;white-space:nowrap}
.b-Open,.b-Urgent{background:var(--warn-bg);color:var(--warn)}
.b-Hoog,.b-Wacht{background:var(--care-bg);color:var(--care)}
.b-Behandeling{background:var(--info-bg);color:var(--info)}
.b-Afgerond,.b-Actief{background:var(--ok-bg);color:var(--ok)}
.b-Laag,.b-Normaal,.b-Geannuleerd,.b-Inactief,.b-grey{background:var(--bg);color:var(--muted)}
.b-sig{background:var(--signal);color:var(--signal-ink)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}

dialog{border:0;border-radius:14px;padding:0;width:min(720px,calc(100% - 16px));max-height:calc(100% - 24px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dh{position:sticky;top:0;background:var(--surface);padding:16px 18px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start;z-index:1}
.dh h2{font-size:24px}
.db{padding:14px 18px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 12px}
.grid .full{grid-column:1 / -1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.err{color:var(--warn);font-size:14px;margin:0;min-height:1em}
.sec{margin-top:20px}
.sec h3{font-size:19px;margin-bottom:8px;color:var(--muted)}
.log{display:grid;gap:6px;font-size:14px}
.log div{background:var(--bg);border-radius:6px;padding:7px 10px}
.log small{color:var(--muted);display:block}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:2px 16px;font-size:15px}
.kv .d{color:var(--muted);text-align:right}

/* Urenstanden */
.ub{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ub select{flex:1 1 200px;width:auto;font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--signal)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:0;border-radius:8px;padding:10px 6px;font:600 15px Barlow,sans-serif;background:var(--surface);color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--signal);color:var(--signal-ink)}
.grp{font:700 17px "Barlow Condensed",sans-serif;color:var(--muted);margin:14px 4px 6px}
.urow{background:var(--surface);border-radius:10px;padding:12px;margin-bottom:8px;display:grid;grid-template-columns:1fr 140px;gap:4px 12px;align-items:center;border-left:6px solid var(--signal)}
.urow.ok{border-left-color:var(--ok)} .urow.bad{border-left-color:var(--warn)} .urow.miss{border-left-color:var(--off);opacity:.75}
.urow .nr{font:700 22px/1 "Barlow Condensed",sans-serif}
.urow .meta{color:var(--muted);font-size:14px}
.urow input{grid-row:1 / span 2;grid-column:2;font-size:20px;font-weight:600;text-align:right;border-width:2px;background:var(--bg)}
.urow.ok input{border-color:var(--ok);background:var(--ok-bg)} .urow.bad input{border-color:var(--warn);background:var(--warn-bg)}
.urow .msg{grid-column:1 / -1;font-size:14px;border-radius:6px;padding:6px 8px}
.msg.bad{background:var(--warn-bg);color:var(--warn)} .msg.care{background:var(--care-bg);color:var(--care)}
.urow .rb{grid-column:1 / -1;display:flex;gap:16px}
.urow .rb button{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px 0;font-size:14px}
.urow .hist{grid-column:1 / -1;border-top:1px solid var(--line);padding-top:6px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg)}
.empty h2{font-size:24px;color:var(--ink);margin-bottom:6px}

/* ---- layout met zijmenu ---- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--head);color:var(--headink);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;padding:18px 10px 14px;overflow-y:auto;z-index:30}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.logo{width:40px;height:40px;border-radius:6px;object-fit:cover;display:block;flex:none}
.brand b{display:block;font:700 19px/1.1 "Barlow Condensed",sans-serif}
.brand small{opacity:.6;font-size:13px}
#nav{display:flex;flex-direction:column;gap:2px}
#nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:inherit;padding:10px 12px;border-radius:8px;font:600 16px Barlow,sans-serif;opacity:.75;text-align:left;border-left:4px solid transparent}
#nav button:hover{opacity:1;background:rgba(255,255,255,.06)}
#nav button[aria-current="page"]{opacity:1;background:rgba(255,255,255,.1);border-left-color:var(--signal)}
#nav svg{width:20px;height:20px;flex:none}
#nav .pill{margin-left:auto}
.side .who{margin-top:auto;padding:14px 10px 0;font-size:13px;opacity:.6;border-top:1px solid rgba(255,255,255,.12)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:26px}
.menu-btn{display:none;border:0;background:var(--surface);color:var(--ink);border-radius:8px;width:42px;height:42px;place-items:center;border:1px solid var(--line)}
.menu-btn svg{width:22px;height:22px}
.scrim{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:260px;padding-top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-102%);transition:transform .2s}
  .shell.open .side{transform:none}
  .shell.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
  .menu-btn{display:grid}
  main{padding:14px 12px 60px}
}
/* ---- dashboard ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border-radius:12px;padding:14px 16px;border:0;border-top:5px solid var(--line);text-align:left;color:inherit}
.tile .n{font:700 40px/1 "Barlow Condensed",sans-serif;margin:4px 0}
.tile .l{color:var(--muted);font-size:14px}
.tile .x{font-size:13px;color:var(--muted)}
.tile.sig{border-top-color:var(--signal)} .tile.red{border-top-color:var(--warn)} .tile.grn{border-top-color:var(--ok)} .tile.blu{border-top-color:var(--info)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.panel{background:var(--surface);border-radius:12px;padding:14px 16px}
.panel h3{font-size:20px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel h3 button{font:500 14px Barlow,sans-serif}
.panel .item{background:var(--bg)}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;padding:5px 0;border:0;background:none;color:inherit;width:100%;text-align:left;font-size:15px}
.hb .tr{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--signal);border-radius:5px}
.hb .v{font-weight:600;min-width:42px;text-align:right}
.hb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.hb:hover .tr i{filter:brightness(.92)}
.prog{margin-bottom:12px}
.prog .t{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}
.prog .tr{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--ok)}
/* ---- stamgegevens & locaties ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.vals{display:grid;gap:4px;margin-bottom:10px}
.val{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;background:var(--bg);font-size:15px}
.val .c{color:var(--muted);font-size:13px}
.val button{border:0;background:none;color:var(--muted);padding:2px 6px;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.val input{padding:4px 8px}
.pchip{border:0;background:var(--info-bg);color:var(--info);border-radius:999px;padding:4px 12px;font:600 13px Barlow,sans-serif;cursor:pointer;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;text-align:left}
.pchip .pn{font-weight:500;color:var(--muted)}
.pchip.add{background:transparent;border:1.5px dashed var(--info)}
.pchip:hover{filter:brightness(.96)}
.paybtn{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;color:transparent;cursor:pointer;padding:0;vertical-align:middle;transition:background .15s,border-color .15s,color .15s,transform .1s}
.paybtn svg{width:18px;height:18px}
.paybtn:hover{border-color:var(--ok);color:var(--ok)}
.paybtn:active{transform:scale(.92)}
.paybtn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.paybtn:disabled{cursor:default;opacity:.55}
.paybtn.busy{opacity:.6;pointer-events:none}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}
.chipset{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--bg);border-radius:8px;padding:8px 10px}
.stats b{display:block;font:700 26px/1 "Barlow Condensed",sans-serif}
.stats span{font-size:13px;color:var(--muted)}
/* ---- meldingen-paneel ---- */
.wide{margin-bottom:12px}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px -4px 12px;flex-wrap:wrap;align-items:flex-end}
.ptabs button{border:0;background:none;color:var(--muted);padding:8px 12px 10px;font:600 16px Barlow,sans-serif;border-bottom:3px solid transparent;margin-bottom:-1px}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.ptabs .sp{flex:1}
.ptabs .btn{margin-bottom:6px}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .gl{fill:var(--muted);font:12px Barlow,sans-serif}
.chart .b1{fill:var(--warn)} .chart .b2{fill:var(--off)}
.chart .hit:hover{fill:var(--line);opacity:.5}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.kpis{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:8px;font-size:14px;color:var(--muted)}
.kpis b{display:block;font:700 26px/1 "Barlow Condensed",sans-serif;color:var(--ink)}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:15px;min-width:640px}
.tbl th{text-align:left;font:600 13px Barlow,sans-serif;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--bg)}
.tbl .num{text-align:right;white-space:nowrap}
.tbl .old{color:var(--warn);font-weight:600}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

/* Supermaritime: uitsluitend kleuren en dashboardachtergrond. */
:root{
  --brand:#0C2579; --brand-deep:#08194F; --brand-soft:#E9EEF9; --brand-hover:#193A96;
  --bg:#F1F4FA; --surface:#FFFFFF; --ink:#17264C; --muted:#596985; --line:#D9E1F0;
  --head:#0C2579; --headink:#FFFFFF; --signal:#0C2579; --signal-ink:#FFFFFF;
  --ok:#1E7A4C; --ok-bg:#E2F2E9; --warn:#B3261E; --warn-bg:#FBE4E2;
  --care:#294786; --care-bg:#EAF0FC; --off:#8B9CC1; --info:#325BBC; --info-bg:#EAF0FD;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08132E; --surface:#111F42; --ink:#EFF3FF; --muted:#B1BEDB; --line:#293C69;
  --head:#0C2579; --headink:#FFFFFF; --signal:#9BB6FF; --signal-ink:#08194F;
  --ok:#5CC98E; --ok-bg:#183326; --warn:#FF8A80; --warn-bg:#3A1D1B;
  --care:#B3C7F5; --care-bg:#1C2F55; --off:#778CAF; --info:#B0C7FF; --info-bg:#1C315F;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#08132E; --surface:#111F42; --ink:#EFF3FF; --muted:#B1BEDB; --line:#293C69;
  --head:#0C2579; --headink:#FFFFFF; --signal:#9BB6FF; --signal-ink:#08194F;
  --ok:#5CC98E; --ok-bg:#183326; --warn:#FF8A80; --warn-bg:#3A1D1B;
  --care:#B3C7F5; --care-bg:#1C2F55; --off:#778CAF; --info:#B0C7FF; --info-bg:#1C315F;
  color-scheme:dark;
}

.btn,.btn.sig{background:var(--brand);color:#FFFFFF}
.btn:hover,.btn.sig:hover{background:var(--brand-hover)}
.btn.alt{background:var(--surface);color:var(--signal)}
.btn.alt:hover{background:var(--info-bg)}
.btn.danger{background:var(--warn-bg);color:var(--warn)}
.btn.danger:hover{background:var(--warn-bg)}
.chips button[aria-pressed="true"]{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
input[type="checkbox"],input[type="radio"]{accent-color:var(--brand)}
.side{background:linear-gradient(170deg,#0C2579 0%,#0B226C 60%,#08194F 100%);color:#FFFFFF}
#nav button:hover{background:rgba(255,255,255,.10)}
#nav button[aria-current="page"]{background:rgba(255,255,255,.17);border-left-color:#FFFFFF;color:#FFFFFF}
#nav .pill{background:rgba(255,255,255,.18);color:#FFFFFF}
.side :focus-visible{outline-color:#FFFFFF}
.tile .n{color:var(--signal)}
.ptabs button[aria-selected="true"]{color:var(--signal)}
.topbar{background:var(--surface)}
.shell{min-height:100vh;background:var(--head)}
.content{position:relative;isolation:isolate;min-width:0;min-height:100vh;background:var(--bg)}
.shell:has(#nav button[data-v="dashboard"][aria-current="page"]) .content{background:transparent}

/* ---- QR-scanner ---- */
.qrside{margin:14px 6px 0;display:flex;align-items:center;gap:10px;border:0;border-radius:10px;background:#FFFFFF;color:#0C2579;font:700 16px Barlow,sans-serif;padding:11px 12px;cursor:pointer}
.qrside svg{width:20px;height:20px}
.qrside:hover{background:#E9EEF9}
.qrfab{display:none;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:0;background:#0C2579;color:#FFFFFF;box-shadow:0 6px 18px rgba(8,25,79,.4);z-index:15;place-items:center;cursor:pointer}
.qrfab svg{width:28px;height:28px}
@media (max-width:860px){.qrfab{display:grid}}
.qrcam{position:relative;width:100%;aspect-ratio:3/4;max-height:62vh;background:#0B1433;border-radius:14px;overflow:hidden}
.qrcam video{width:100%;height:100%;object-fit:cover;display:block}
.qrcam .frame{position:absolute;inset:50% auto auto 50%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.qrcam .frame i{position:absolute;width:38px;height:38px;border:5px solid #FFFFFF}
.qrcam .frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.qrcam .frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.qrcam .frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 12px}
.qrcam .frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 12px 0}
.qrcam .hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#FFFFFF;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6);padding:0 16px}
.qrhead{background:linear-gradient(170deg,#0C2579,#08194F);color:#FFFFFF;border-radius:12px;padding:14px 16px;margin-bottom:12px}
.qrhead .t{font:700 30px/1.1 "Barlow Condensed",sans-serif}
.qrhead .chips2{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.qrhead .chips2 span{background:rgba(255,255,255,.16);border-radius:999px;padding:3px 10px;font-size:13px}
.qrhead .chips2 .red{background:#FBE4E2;color:#B3261E;font-weight:600}
.qract{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font:600 16px Barlow,sans-serif;min-height:58px;cursor:pointer}
.qract .ic{width:38px;height:38px;border-radius:10px;background:var(--info-bg);display:grid;place-items:center;flex:none;font-size:18px}
.qract small{display:block;font:500 13px Barlow,sans-serif;color:var(--muted)}
.qract.main{background:#0C2579;color:#FFFFFF;border-color:#0C2579}
.qract.main .ic{background:rgba(255,255,255,.16)}
.qract.main small{color:rgba(255,255,255,.8)}
#printArea{display:none}
@media print{
  body > *:not(#printArea){display:none !important}
  #printArea{display:block !important}
  @page{size:A4;margin:10mm}
  .labels{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}
  .label{border:0.3mm dashed #9aa6c4;border-radius:2mm;padding:3mm;display:flex;gap:3mm;align-items:center;height:36mm;box-sizing:border-box;break-inside:avoid;font-family:Barlow,Arial,sans-serif;color:#0C2579}
  .label svg{width:28mm;height:28mm;flex:none}
  .label b{display:block;font:700 18pt "Barlow Condensed",Arial,sans-serif}
  .label span{display:block;font-size:9pt;color:#17264C}
}
</style>

<script>
/* Heftrucks Supermaritime – objecten, werkorders en urenstanden */
'use strict';

// ---------- hulpfuncties ----------
const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : String(k));
  return el;
}
const fmt = n => n == null ? '' : Number(n).toLocaleString('nl-NL', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const parseNum = s => { s = String(s ?? '').trim().replace(/\s/g, ''); if (!s) return null;
  if (/,/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); const n = Number(s); return isFinite(n) ? n : NaN; };
const dt = s => s ? new Date(s).toLocaleString('nl-NL', { dateStyle: 'short', timeStyle: 'short' }) : '';
const dLabel = d => new Date(d + 'T12:00:00').toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' });
const woNr = id => 'WO-' + String(id).padStart(5, '0');
const xv = v => v != null ? fmt(v).replace(/\./g, '') : '';
const cls = s => String(s || '').replace(/\s+/g, '.');
let toastT;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600); }
async function copyText(t) { try { await navigator.clipboard.writeText(t); toast('Gekopieerd'); return true; } catch (e) { return false; } }

const STATUS_WO = ['Open', 'In behandeling', 'Wacht op onderdelen', 'Afgerond', 'Geannuleerd'];
const OPEN_WO = ['Open', 'In behandeling', 'Wacht op onderdelen'];
const SOORT_WO = ['Storing', 'Schade', 'Reparatie', 'Onderhoud', 'Overig'];
const PRIO = ['Laag', 'Normaal', 'Hoog', 'Urgent'];
const locs = () => { const l = D.locaties.map(x => x.naam).filter(Boolean).sort((a, b) => a.localeCompare(b)); return l.length ? l : ['Duitslandweg', 'Oostenrijkweg']; };
const stamL = () => (D.stam.find(x => x._id === 'lijsten') || {});
const soorten = cur => { const l = (stamL().soorten || []).length ? stamL().soorten : SOORT_WO; return cur && !l.includes(cur) ? l.concat([cur]) : l; };
function askConfirm(msg) { const c = $('cdlg'); $('cmsg').textContent = msg;
  return new Promise(res => { const done = v => { c.close(); $('cyes').onclick = $('cno').onclick = null; res(v); };
    $('cyes').onclick = () => done(true); $('cno').onclick = () => done(false); c.oncancel = e => { e.preventDefault(); done(false); }; c.showModal(); }); }
const badgeCls = v => 'badge b-' + ({ 'In behandeling': 'Behandeling', 'Wacht op onderdelen': 'Wacht' }[v] || v);

// ---------- database (Claude) ----------
let db = null, U = null, me = '';
const D = { objecten: [], werkorders: [], periodes: [], uren: [], locaties: [], stam: [], facturen: [], projecten: [], arbeid: [], documenten: [], doorbelasting: [] };
const objById = () => Object.fromEntries(D.objecten.map(o => [o.id, o]));
const names = {};
const who = id => !id ? '' : id === me ? 'jij' : (names[id] || 'collega');
async function resolveNames() {
  if (!U) return;
  const ids = new Set();
  D.werkorders.forEach(w => { ids.add(w.gemeld_door); (w.log || []).forEach(l => ids.add(l.door)); });
  D.objecten.forEach(o => ids.add(o.gewijzigd_door)); D.uren.forEach(u => ids.add(u.ingevuld_door));
  const list = [...ids].filter(x => x && !(x in names)); if (!list.length) return;
  try { const ps = await U.profiles(list); for (const id of list) names[id] = (ps[id] && ps[id].name) || ''; } catch (e) { }
}
function fail(error, where) { console.error(where, error); toast('Opslaan mislukt: ' + (error && (error.message || error.code) || error)); }
const col = n => db.collection(n);
const docs = snap => snap.docs.map(d => Object.assign({ _id: d.id }, d.data()));

let renderPending = false;
function softRender() {
  const a = document.activeElement;
  if (dlg.open || (a && $('main').contains(a) && a.matches('input,textarea,select'))) { renderPending = true; return; }
  renderPending = false; render();
}
document.addEventListener('focusout', () => setTimeout(() => { if (renderPending) softRender(); }, 300));

async function start() {
  const msg = (t, m) => $('main').replaceChildren(h('div', { class: 'empty' }, h('h2', {}, t), h('p', {}, m)));
  $('app').hidden = false;
  $('main').replaceChildren(h('div', { class: 'empty' }, 'Laden…'));
  [db, U] = await Promise.all([claude.use('db'), claude.use('user')]);
  if (!db) return msg('Geen verbinding', 'Kan geen verbinding maken met de database.');
  if (U) { me = (await U.id()) || ''; const v = await U.me(); $('who').textContent = v.name ? 'Ingelogd als ' + v.name : ''; }
  let first = 11; const ready = () => { if (--first === 0) { updCounts(); render(); openFromHash(); } };
  const sub = (name, key, map) => { let got = false;
    col(name).onSnapshot(snap => { D[key] = docs(snap).map(map || (x => x));
      updCounts();
      resolveNames().then(() => { if (!got) { got = true; ready(); } else softRender(); }); },
    e => { if (!got) { got = true; ready(); } toast('Verbinding: ' + (e.message || e.code)); }); };
  sub('objecten', 'objecten', x => Object.assign(x, { id: x._id }));
  sub('werkorders', 'werkorders', x => Object.assign(x, { id: Number(x._id) }));
  sub('periodes', 'periodes', x => Object.assign(x, { id: x._id }));
  sub('uren', 'uren');
  sub('locaties', 'locaties', x => Object.assign(x, { id: x._id }));
  sub('stam', 'stam');
  sub('facturen', 'facturen', x => Object.assign(x, { id: x._id }));
  sub('projecten', 'projecten', x => Object.assign(x, { id: x._id }));
  sub('arbeid', 'arbeid', x => Object.assign(x, { id: x._id }));
  sub('documenten', 'documenten', x => Object.assign(x, { id: x._id }));
  sub('doorbelasting', 'doorbelasting', x => Object.assign(x, { id: x._id }));
}
function updCounts() { $('woCount').textContent = D.werkorders.filter(x => OPEN_WO.includes(x.status)).length || ''; $('factCount').textContent = D.facturen.filter(f => f.status === 'Te controleren').length || ''; }

// ---------- navigatie ----------
const VIEWS = { dashboard: 'Dashboard', objecten: 'Objecten', onderhoud: 'Onderhoud', uren: 'Urenstanden', facturatie: 'Facturatie', stam: 'Stamgegevens', locaties: 'Locaties' };
const norm = v => v === 'werkorders' ? 'onderhoud' : v;
let view = norm(location.hash.slice(1)); if (!VIEWS[view]) view = 'dashboard';
$('qrSide').addEventListener('click', () => { $('app').classList.remove('open'); qrScan(); });
$('qrFab').addEventListener('click', () => qrScan());
function go(v, f) { if (f) Object.assign(v === 'objecten' ? oF : v === 'onderhoud' ? wF : v === 'facturatie' ? fF : uF, f); view = v; try { history.replaceState(null, '', '#' + v); } catch (er) { } render(); window.scrollTo(0, 0); }
$('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.v); });
window.addEventListener('hashchange', () => { if (/^#obj-/.test(location.hash)) return openFromHash(); const v = norm(location.hash.slice(1)); if (VIEWS[v] && v !== view) { view = v; render(); } });
$('menuBtn').addEventListener('click', () => $('app').classList.add('open'));
$('scrim').addEventListener('click', () => $('app').classList.remove('open'));
function render() {
  $('app').classList.remove('open');
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.v === view ? 'page' : 'false'));
  $('pageTitle').textContent = VIEWS[view]; document.title = VIEWS[view] + ' · Supermaritime onderhoud';
  ({ dashboard: viewDashboard, objecten: viewObjecten, onderhoud: viewWerkorders, uren: viewUren, facturatie: viewFacturatie, stam: viewStam, locaties: viewLocaties })[view]();
}

// ---------- dialoog ----------
const dlg = $('dlg');
function openDlg(title, body, sub) {
  $('dlgBody').replaceChildren(
    h('div', { class: 'dh' }, h('div', {}, h('h2', {}, title), sub ? h('div', { class: 'muted' }, sub) : null),
      h('button', { class: 'btn alt', type: 'button', onclick: () => dlg.close() }, 'Sluiten')),
    h('div', { class: 'db' }, body));
  if (!dlg.open) dlg.showModal();
}
dlg.addEventListener('close', () => { renderPending = false; render(); });

// =====================================================================
// OBJECTEN
// =====================================================================
const oF = { q: '', loc: '', type: '', status: 'Actief' };
function objName(o) { return o.twv ? `TWV ${o.twv}` : (o.omschrijving || o.id); }
function viewObjecten() {
  const types = [...new Set(D.objecten.map(o => o.objecttype).filter(Boolean))].sort();
  const openBy = {}; D.werkorders.filter(w => OPEN_WO.includes(w.status)).forEach(w => openBy[w.object_id] = (openBy[w.object_id] || 0) + 1);
  const sel = (key, label, opts) => h('select', { 'aria-label': label, onchange: e => { oF[key] = e.target.value; draw(); } },
    h('option', { value: '' }, label), opts.map(v => h('option', { value: v, selected: oF[key] === v }, v)));
  const search = h('input', { type: 'search', placeholder: 'Zoek op TWV, nummer of omschrijving', value: oF.q, oninput: e => { oF.q = e.target.value; draw(); } });
  const list = h('div', { class: 'list' }); const sum = h('p', { class: 'summary' });
  $('main').replaceChildren(
    h('div', { class: 'toolbar' }, search, sel('loc', 'Alle locaties', locs()), sel('type', 'Alle objecttypes', types),
      sel('status', 'Alle statussen', ['Actief', 'Inactief', 'Buiten gebruik', 'Verkocht']),
      h('button', { class: 'btn alt', type: 'button', onclick: () => qrStickers() }, 'QR-stickers printen'),
      h('button', { class: 'btn sig', type: 'button', onclick: () => editObject(null) }, 'Nieuw object')),
    sum, list);
  function draw() {
    const q = oF.q.trim().toLowerCase();
    const items = D.objecten.filter(o => (!oF.loc || o.locatie === oF.loc) && (!oF.type || o.objecttype === oF.type) && (!oF.status || o.status === oF.status)
      && (!q || [o.id, o.twv, o.omschrijving, o.serienummer, o.type].some(v => v && String(v).toLowerCase().includes(q))))
      .sort((a, b) => (a.objecttype || '').localeCompare(b.objecttype || '') || (Number(a.twv) || 1e9) - (Number(b.twv) || 1e9) || a.id.localeCompare(b.id));
    sum.textContent = `${items.length} objecten`;
    list.replaceChildren(...(items.length ? items.map(o => h('button', { class: 'item', type: 'button', onclick: () => showObject(o.id) },
      h('div', { class: 't' }, objName(o), o.type ? h('span', { class: 'muted', style: 'font-weight:600;font-size:16px' }, '  ' + o.type) : null),
      h('div', { class: 's' }, [o.omschrijving !== objName(o) ? o.omschrijving : null, o.id, o.objecttype, [o.locatie, o.dc].filter(Boolean).join(' ')].filter(Boolean).join('  ·  ')),
      h('div', { class: 'r' }, openBy[o.id] ? h('span', { class: 'badge b-Open' }, `${openBy[o.id]} open`) : null,
        o.status !== 'Actief' ? h('span', { class: badgeCls(o.status) }, o.status) : null,
        o.urenregistratie ? h('span', { class: 'badge b-grey' }, 'uren') : null)))
      : [h('div', { class: 'empty' }, 'Geen objecten gevonden.')]));
  }
  draw();
}

function showObject(id) {
  const o = objById()[id]; if (!o) return;
  const wos = D.werkorders.filter(w => w.object_id === id);
  const per = Object.fromEntries(D.periodes.map(p => [p.id, p]));
  const ur = D.uren.filter(u => u.object_id === id && per[u.periode_id]).sort((a, b) => per[a.periode_id].datum.localeCompare(per[b.periode_id].datum));
  const row = (k, v) => v ? [h('span', { class: 'muted' }, k), h('span', {}, v), h('span')] : [];
  let last = null;
  openDlg(objName(o), [
    h('div', { class: 'kv' },
      row('Omschrijving', o.omschrijving), row('Objectnummer', o.id), row('Type', o.type), row('Merk', o.merk), row('Model', o.model),
      row('Serienummer', o.serienummer), row('Objecttype', o.objecttype), row('Locatie', [o.locatie, o.dc].filter(Boolean).join(' ')),
      row('Status', o.status), row('Eigendom', o.eigendom), row('Leverancier', o.leverancier), row('Opmerking', o.opmerking),
      row('Urenregistratie', o.urenregistratie ? 'Ja' : 'Nee'), row('Laatst gewijzigd', o.gewijzigd_op ? `${dt(o.gewijzigd_op)}${o.gewijzigd_door ? ' door ' + who(o.gewijzigd_door) : ''}` : null)),
    h('div', { class: 'actions' },
      h('button', { class: 'btn sig', type: 'button', onclick: () => newWerkorder(id) }, 'Storing melden'),
      h('button', { class: 'btn alt', type: 'button', onclick: () => editObject(o) }, 'Gegevens wijzigen')),
    h('div', { class: 'sec' }, h('h3', {}, `Werkorders (${wos.length})`),
      wos.length ? h('div', { class: 'list' }, wos.map(woItem)) : h('p', { class: 'muted' }, 'Nog geen werkorders.')),
    h('div', { class: 'sec' }, h('h3', {}, 'Urenstanden'),
      ur.length ? h('div', { class: 'kv' }, ur.map(u => {
        const d = (u.waarde != null && last != null) ? (u.waarde - last >= 0 ? '+' : '') + fmt(u.waarde - last) : '';
        if (u.waarde != null) last = u.waarde;
        return [h('span', {}, per[u.periode_id].naam), h('span', { style: 'text-align:right' }, u.niet_gevonden ? 'niet gevonden' : fmt(u.waarde)), h('span', { class: 'd' }, d)];
      })) : h('p', { class: 'muted' }, 'Geen urenstanden.')),
    kostenBlok(o)
  ], o.omschrijving !== objName(o) ? o.omschrijving : o.id);
}

function editObject(o, preset) {
  const isNew = !o; o = o || Object.assign({ status: 'Actief', objecttype: 'Heftrucks', urenregistratie: false }, preset || {});
  const types = [...new Set(D.objecten.map(x => x.objecttype).concat(stamL().objecttypes || []).filter(Boolean))].sort();
  const dl = (id, vals) => h('datalist', { id }, [...new Set(vals.filter(Boolean))].sort().map(v => h('option', { value: v })));
  const inp = (name, label, extra) => h('label', { class: extra?.full ? 'full' : null }, label,
    extra?.area ? h('textarea', { name }, o[name] || '') : h('input', Object.assign({ name, value: o[name] ?? '', autocomplete: 'off' }, extra?.attrs || {})));
  const sel = (name, label, opts, blank) => h('label', {}, label, h('select', { name },
    blank ? h('option', { value: '' }, blank) : null, opts.map(v => h('option', { value: v, selected: (o[name] || '') === v }, v))));
  const err = h('p', { class: 'err full' });
  const form = h('form', { class: 'grid', onsubmit: e => e.preventDefault() },
    inp('twv', 'TWV-nummer', { attrs: { inputmode: 'numeric' } }),
    isNew ? inp('id', 'Objectnummer (leeg = automatisch)') : h('label', {}, 'Objectnummer', h('input', { value: o.id, disabled: true })),
    inp('omschrijving', 'Omschrijving', { full: true }),
    inp('type', 'Type (bv. E20, T16)'), inp('merk', 'Merk', { attrs: { list: 'merken' } }), inp('model', 'Model'), inp('serienummer', 'Serienummer'),
    dl('merken', D.objecten.map(x => x.merk).concat(stamL().merken || [])), dl('leveranciers', D.objecten.map(x => x.leverancier).concat(stamL().leveranciers || [])),
    dl('hallen', D.locaties.flatMap(x => x.hallen || []).concat(D.objecten.map(x => x.dc))),
    h('label', {}, 'Objecttype', h('input', { name: 'objecttype', value: o.objecttype || '', list: 'otypes', autocomplete: 'off' }), h('datalist', { id: 'otypes' }, types.map(t => h('option', { value: t })))),
    sel('locatie', 'Locatie', locs(), 'Onbekend'), inp('dc', 'DC / hal', { attrs: { list: 'hallen' } }),
    sel('status', 'Status', ['Actief', 'Inactief', 'Buiten gebruik', 'Verkocht']),
    sel('eigendom', 'Eigendom', ['Eigen', 'Huur', 'Lease'], 'Onbekend'), inp('leverancier', 'Leverancier', { attrs: { list: 'leveranciers' } }),
    inp('opmerking', 'Opmerking', { full: true, area: true }),
    h('label', { class: 'chk full' }, h('input', { type: 'checkbox', name: 'urenregistratie', checked: !!o.urenregistratie }), 'Opnemen in urenstanden'),
    err);
  const save = async () => {
    const f = form.elements; err.textContent = '';
    const val = n => (f[n].value || '').trim() || null;
    const rec = { twv: val('twv'), omschrijving: val('omschrijving'), type: (val('type') || '').toUpperCase() || null, merk: val('merk'), model: val('model'),
      serienummer: val('serienummer'), objecttype: val('objecttype'), locatie: val('locatie'), dc: (val('dc') || '').toUpperCase() || null,
      status: val('status') || 'Actief', eigendom: val('eigendom'), leverancier: val('leverancier'), opmerking: val('opmerking'),
      urenregistratie: f.urenregistratie.checked, gewijzigd_op: new Date().toISOString(), gewijzigd_door: me };
    if (!rec.twv && !rec.omschrijving) { err.textContent = 'Vul minstens een TWV-nummer of omschrijving in.'; return; }
    if (rec.twv) { const dup = D.objecten.find(x => x.twv === rec.twv && x.id !== o.id && x.status === 'Actief');
      if (dup && !await askConfirm(`TWV ${rec.twv} bestaat al (${dup.id}). Toch opslaan?`)) return; }
    if (!rec.omschrijving) rec.omschrijving = [rec.type, rec.twv ? 'TWV ' + rec.twv : null].filter(Boolean).join(' ');

function qrWerkorders(o) {
  const ws = D.werkorders.filter(w => w.object_id === o.id).sort((a, b) => (OPEN_WO.includes(b.status) - OPEN_WO.includes(a.status)) || b.id - a.id);
  openDlg('Werkorders ' + (o.twv ? 'TWV ' + o.twv : o.id), [ws.length ? h('div', { class: 'list' }, ws.slice(0, 20).map(woItem)) : h('p', { class: 'muted' }, 'Nog geen werkorders voor deze truck.'),
    h('div', { class: 'actions' }, h('button', { class: 'btn sig', type: 'button', onclick: () => newWerkorder(o.id) }, 'Storing melden'), h('button', { class: 'btn alt', type: 'button', onclick: () => qrResultaat(o) }, 'Terug'))]);
}
function qrLink(o) { return location.origin + location.pathname + '#obj-' + o.id; }
async function qrStickers() {
  const trucks = D.objecten.filter(o => o.status === 'Actief' && /heftruck|pompkar|rijdend/i.test(o.objecttype || '')).sort((a, b) => (Number(a.twv) || 1e9) - (Number(b.twv) || 1e9));
  const zicht = D.objecten.filter(o => (!oF.loc || o.locatie === oF.loc) && (!oF.type || o.objecttype === oF.type) && (!oF.status || o.status === oF.status));
  const chosen = new Set(); const q = h('input', { type: 'search', placeholder: 'Zoek TWV-nummer', autocomplete: 'off' });
  const list = h('div', { class: 'vals', style: 'max-height:300px;overflow:auto' }); const cnt = h('b');
  const upd = () => { cnt.textContent = chosen.size ? `${chosen.size} stickers` : 'Kies trucks'; pr.disabled = !chosen.size; };
  const draw = () => { const t = q.value.trim().toLowerCase(); list.replaceChildren(...trucks.filter(o => !t || [o.twv, o.id, o.type].some(v => v && String(v).toLowerCase().includes(t))).map(o =>
    h('label', { class: 'val chk', style: 'display:grid;grid-template-columns:auto 110px 1fr' }, h('input', { type: 'checkbox', checked: chosen.has(o.id), onchange: e => { e.target.checked ? chosen.add(o.id) : chosen.delete(o.id); upd(); } }), h('b', {}, o.twv ? 'TWV ' + o.twv : o.id), h('span', { class: 'c' }, [o.type, o.locatie].filter(Boolean).join(' · '))))); };
  const pr = h('button', { class: 'btn', type: 'button', disabled: true, onclick: async () => {
    try { await loadScript(QRGEN); } catch (e) { return toast(e.message); }
    const sel = D.objecten.filter(o => chosen.has(o.id)).sort((a, b) => (Number(a.twv) || 1e9) - (Number(b.twv) || 1e9));
    const area = $('printArea'); area.innerHTML = '';
    const grid = h('div', { class: 'labels' });
    sel.forEach(o => { const g = qrcode(0, 'M'); g.addData(qrLink(o)); g.make(); const lab = h('div', { class: 'label' }); lab.innerHTML = g.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
      lab.append(h('div', {}, h('b', {}, o.twv ? 'TWV ' + o.twv : o.id), h('span', {}, [o.merk || (/linde/i.test(o.omschrijving || '') ? 'Linde' : ''), o.type].filter(Boolean).join(' ')), h('span', {}, 'Supermaritime · ' + o.id))); grid.append(lab); });
    area.append(grid); setTimeout(() => window.print(), 100); } }, 'Printen');
  q.addEventListener('input', draw); draw(); upd();
  openDlg('QR-stickers printen', [
    h('div', { class: 'actions', style: 'margin-top:0' },
      h('button', { class: 'btn alt', type: 'button', onclick: () => { trucks.forEach(o => chosen.add(o.id)); draw(); upd(); } }, `Alle actieve heftrucks (${trucks.length})`),
      h('button', { class: 'btn alt', type: 'button', onclick: () => { zicht.forEach(o => chosen.add(o.id)); draw(); upd(); } }, `Objecten in de lijst (${zicht.length})`),
      h('button', { class: 'btn alt', type: 'button', onclick: () => { chosen.clear(); draw(); upd(); } }, 'Niets')),
    q, list, h('div', { class: 'actions', style: 'align-items:center' }, cnt, pr)],
    'Drie stickers per rij op A4. De code opent de app direct bij die truck, ook met de gewone camera van de telefoon.');
}
